<template>
    <template lwc:if={isLoading}>
        <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
    </template>

    <template lwc:if={alreadyProcessed}>
        <div class="slds-p-around_large slds-text-align_center">
            <lightning-icon icon-name="utility:info" size="medium" variant="warning"></lightning-icon>
            <p class="slds-text-heading_small slds-m-top_medium">This case has already been processed.</p>
            <p class="slds-text-body_regular slds-m-top_small slds-text-color_weak">Status: {caseStatus}</p>
            <div class="slds-m-top_large">
                <lightning-button label="Close" onclick={handleClose}></lightning-button>
            </div>
        </div>
    </template>

    <template lwc:if={showForm}>
        <div class="slds-p-around_medium">
            <template lwc:if={caseInfo}>
                <div class="slds-m-bottom_medium slds-box slds-box_x-small">
                    <p><strong>Name:</strong> {caseInfo.SuppliedName}</p>
                    <p><strong>Phone:</strong> {caseInfo.SuppliedPhone}</p>
                    <p><strong>Email:</strong> {caseInfo.SuppliedEmail}</p>
                </div>
            </template>

            <div class="slds-m-bottom_medium">
                <lightning-input
                    type="checkbox"
                    label="Include test data (Financial Accounts, Transactions, Cards, Recurring Payments)"
                    checked={includeTestData}
                    onchange={handleTestDataToggle}
                ></lightning-input>
                <p class="slds-text-body_small slds-m-top_x-small slds-text-color_weak">
                    When checked, creates Savings, Credit Card, Loan accounts with sample transactions, cards, and recurring payments.
                </p>
            </div>

            <div class="slds-text-align_right slds-m-top_large">
                <lightning-button label="Cancel" onclick={handleClose} class="slds-m-right_x-small"></lightning-button>
                <lightning-button
                    variant="brand"
                    label={submitLabel}
                    icon-name="utility:check"
                    onclick={handleApprove}
                    disabled={isProcessing}
                ></lightning-button>
            </div>
        </div>
    </template>
</template>

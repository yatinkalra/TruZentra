<template>
    <div class="result-wrapper">

        <!-- Success Header -->
        <div class="success-header">
            <div class="success-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="11" fill="#4caf50"/>
                    <path d="M8 12l3 3 5-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h2 class="success-title">Dispute Filed Successfully</h2>
            <p class="success-subtitle">Your document has been analysed and a dispute case has been created. A confirmation email is on its way.</p>
        </div>

        <!-- Dispute Info Cards -->
        <div class="info-grid">
            <div class="info-card">
                <div class="info-icon info-icon-indigo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke="#1a237e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <p class="info-label">Case Number</p>
                <p class="info-value info-value-brand">{caseNumber}</p>
            </div>
            <div class="info-card">
                <div class="info-icon info-icon-slate">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <p class="info-label">Dispute Amount</p>
                <p class="info-value">{formattedAmount}</p>
            </div>
            <div class="info-card info-card-green">
                <div class="info-icon info-icon-green">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="#2e7d32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <p class="info-label">Provisional Credit</p>
                <p class="info-value info-value-green">{formattedAmount} Issued</p>
            </div>
            <div class="info-card">
                <div class="info-icon info-icon-amber">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke="#e65100" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <p class="info-label">Est. Resolution</p>
                <p class="info-value">{estimatedResolution}</p>
            </div>
        </div>

        <!-- AI Analysis -->
        <template if:true={aiAnalysis}>
            <div class="analysis-card">
                <div class="analysis-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke="#1a237e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>AI Analysis Summary</span>
                </div>
                <p class="analysis-text">{aiAnalysis}</p>
            </div>
        </template>

        <!-- Footer message + Close button -->
        <div class="result-footer">
            <p class="footer-msg">A confirmation email has been sent to your registered address. You may return to the TruZentra assistant to check dispute status anytime.</p>
            <button class="close-btn" onclick={handleClose}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Close This Tab</span>
            </button>
        </div>

    </div>
</template>
